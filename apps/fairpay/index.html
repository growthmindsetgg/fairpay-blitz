<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FairPay: split bills with friends and pay on Monad, with optional confidential payments." />
    <title>FairPay</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- The app's first request (src/main.tsx). Asking now, while the scripts download, saves a round
         trip, and a sleeping server starts waking a second or two sooner. /api is at the site root
         under every base, so Vite must leave this path alone. -->
    <link rel="preload" href="/api/config" as="fetch" crossorigin="use-credentials" vite-ignore />
  </head>
  <body>
    <noscript>FairPay needs JavaScript.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
